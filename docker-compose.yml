# Free Video Studio - one command starts everything:
#   docker compose up -d --build
# Then open http://127.0.0.1:8000

services:
  # Free local AI model server (Ollama). Models are stored in the ollama-models volume.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Downloads the chosen AI model once, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["sh", "-c", "ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  # The studio itself (web page + video rendering + speech-to-text)
  studio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./projects:/app/projects
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HIGGSFIELD_KEY_ID: ${HIGGSFIELD_KEY_ID:-}
      HIGGSFIELD_KEY_SECRET: ${HIGGSFIELD_KEY_SECRET:-}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
